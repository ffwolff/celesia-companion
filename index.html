<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Celesia Companion</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">

</head>

<body>

    <main id="app">

        <section class="home">

            <img
                src="assets/logo/celesia_logo_001.png"
                alt="Logo CELESIA"
                class="home-logo">

            <h1 class="home-title">
                CELESIA COMPANION
            </h1>

            <div class="player-selector">

                <button
                    class="selector-button"
                    id="decreasePlayers">

                    ◀

                </button>

                <span
                    id="playerCount"
                    class="selector-value">

                    2

                </span>

                <button
                    class="selector-button"
                    id="increasePlayers">

                    ▶

                </button>

            </div>

            <button
                id="startButton"
                class="start-button">

                INICIAR

            </button>

        </section>

    </main>

    <script src="js/player.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/colors.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
